[package]
name = "photobook-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
debug_dependency_locks = []
wgpu = []
snapshot = []

[dependencies]
# re_ui = "0.23.1"
egui = { version = "0.34.1" }
eframe = { version = "0.34.1", features = ["glow", "wgpu"] }
egui_extras = { version = "0.34.1", features = ["default", "all_loaders"] }
native-dialog = "0.9.6"
env_logger = "0.11.10"
image = { version = "0.25.10", features = ["jpeg", "png"] }
tokio = { version = "1.51.1", features = ["full", "rt-multi-thread"] }
once_cell = "1.21.4"
fast_image_resize = "6.0.0"
anyhow = "1.0.102"
flexi_logger = "0.31.8"
log = "0.4"
kamadak-exif = "0.6.1"
imagesize = "0.14.0"
backtrace = "0.3"
open = "5.3.3"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
chrono = { version = "0.4.44", features = ["serde"] }
indexmap = { version = "2.14.0", features = ["serde"] }
font-kit = "0.14.3"
egui_tiles = "0.15.0"
ab_glyph = "0.2.32"
rand = "0.10.1"
smol_egui_skia = { git = "https://github.com/RyanBluth/smol_egui_skia.git", branch = "main" }
skia-safe = { version = "0.93", features = ["vulkan"] }
wgpu = { version = "29.0.1", features = ["vulkan", "metal", "dx12", "gles"] }
thiserror = "2.0.18"
printpdf = { version = "0.9.1", features = ["jpeg", "png"] }
serde = { version = "1.0.228", features = ["derive"] }
ron = "0.12"
calculate = { git = "https://github.com/RyanBluth/calc.git", branch = "master" }
num-traits = "0.2"
serde_json = "1.0.149"
dirs = "6.0.0"
fxhash = "0.2.1"
toml = "1.1.2"
glob = "0.3.3"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
profiling = { version = "1.0.17", default-features = false }
notify = "8.2.0"
num_cpus = "1.17.0"
rkyv = "0.8.15"
savefile = { version = "0.20.2", features = ["bzip2", "serde"] }
savefile-derive = "0.20.2"

[dev-dependencies]
egui_kittest = { version = "0.34.1", features = ["wgpu", "snapshot"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# lto = "fat"
codegen-units = 1
panic = "abort"


[patch.crates-io]
# egui_kittest = { path = "../egui/crates/egui_kittest" }
